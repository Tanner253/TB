name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TopBlast

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: TopBlast/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Run tests
        run: npm test --if-present
        env:
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-not-for-production

      - name: Build
        run: npm run build
        env:
          TOKEN_MINT_ADDRESS: So11111111111111111111111111111111111111112
          TOKEN_SYMBOL: TEST
          HELIUS_API_KEY: test-helius-key
          MONGODB_URI: mongodb://localhost:27017/test
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
          CRON_SECRET: ci-test-cron-secret
