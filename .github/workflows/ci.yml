# TopBlast CI — tests run in GitHub Actions only (never during Vercel build).
# Vercel uses `npm run build` with production env; tests use fake CI env below.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  APP_DIR: TopBlast
  WHITEPAPER_DIR: whitepaper

jobs:
  test-topblast:
    name: TopBlast Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-not-for-production

  lint-topblast:
    name: TopBlast Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

  build-topblast:
    name: TopBlast Build
    runs-on: ubuntu-latest
    needs: [test-topblast]
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          TOKEN_MINT_ADDRESS: So11111111111111111111111111111111111111112
          TOKEN_SYMBOL: TEST
          HELIUS_API_KEY: test-helius-key
          MONGODB_URI: mongodb://127.0.0.1:27017/topblast-ci
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
          CRON_SECRET: ci-test-cron-secret

  build-whitepaper:
    name: Whitepaper Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WHITEPAPER_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WHITEPAPER_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build whitepaper
        run: npm run build

  deploy-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [test-topblast, build-topblast, build-whitepaper]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment check
        run: |
          echo "All CI checks passed."
          echo "Vercel should deploy using build-only (no tests in vercel-build)."
