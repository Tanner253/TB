name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topblast:
    name: TopBlast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TopBlast

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: TopBlast/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Run tests
        run: npm test
        env:
          CI: true
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-not-for-production

      - name: Build
        run: npm run build
        env:
          TOKEN_MINT_ADDRESS: So11111111111111111111111111111111111111112
          TOKEN_SYMBOL: TEST
          HELIUS_API_KEY: test-helius-key
          MONGODB_URI: mongodb://localhost:27017/test
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
          CRON_SECRET: ci-test-cron-secret

  whitepaper:
    name: Whitepaper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whitepaper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whitepaper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npm run build
